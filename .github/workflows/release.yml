name: Release

# Changesets-driven publishing (see publish-package.md):
#   1. You land changes on main that include a changeset
#      (`pnpm changeset` describes the bump).
#   2. This workflow opens/updates a "chore: version packages" PR with the
#      version bump + CHANGELOG entry.
#   3. Merging that PR publishes @iammikz/srui to npm and tags a GitHub
#      release. No other manual steps.
#
# One-time setup: add an npm **automation** token (or a granular token with
# Packages: Read and write) as the repository secret `NPM_TOKEN`.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # Version Packages commits, tags, releases
  pull-requests: write # Version Packages PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changesets can reason about pending changes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm 9.x per the implementation plan)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check NPM_TOKEN secret
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: >
          echo "::error::NPM_TOKEN secret is missing. Add an npm automation
          token as the NPM_TOKEN repository secret, otherwise merging the
          Version Packages PR will fail to publish."

      # pnpm reads the user-level npm config this writes.
      - name: Configure npm auth
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          # Builds the library (dist ships in the tarball), then publishes.
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
