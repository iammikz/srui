name: Release

# Tokenless changesets-driven publishing via npm **trusted publishing**
# (OIDC). No NPM_TOKEN secret is stored: at publish time GitHub issues a
# short-lived OIDC token that npm exchanges for one-time publish
# credentials, after matching it against the trusted publisher registered
# on the @iammikz/srui package settings page.
#
# One-time npm-side setup (no secrets involved):
#   npmjs.com → @iammikz/srui → Settings → Trusted Publisher → add:
#     repository owner: iammikz
#     repository name:  srui
#     workflow:         .github/workflows/release.yml
#     environment:      (leave empty)
#
# Flow after that: `pnpm changeset` on a branch → merge to main → this
# workflow opens/updates a "chore: version packages" PR → merging that PR
# publishes to npm (with provenance) and tags a GitHub release.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # Version Packages commits, tags, releases
  pull-requests: write # Version Packages PR
  id-token: write # OIDC token for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changesets can reason about pending changes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm 9.x per the implementation plan)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      # npm's CLI performs the OIDC exchange for trusted publishing; make
      # sure it's new enough (support shipped in recent npm releases).
      - name: Use latest npm CLI
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          # pnpm builds the library (dist ships in the tarball); npm then
          # publishes — pnpm's publish doesn't do the OIDC exchange, npm's
          # does. --no-provenance: npm provenance requires a PUBLIC source
          # repository (the attestation links to public repo/workflow
          # metadata), and this repo stays private. Tokenless trusted
          # publishing itself works fine from private repos; only the
          # provenance badge is given up. Flip to --provenance if the repo
          # ever goes public.
          publish: pnpm build && npm publish packages/react --access public --no-provenance
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
